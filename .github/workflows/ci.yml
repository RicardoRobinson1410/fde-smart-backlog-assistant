name: FDE Smart Backlog Assistant CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate sample PDF specification
        run: python scripts/generate_sample_pdf.py

      - name: Run pytest unit & golden scenario suite
        run: pytest -v

      - name: Run CLI Golden Evaluation Scorecard (Default + SRE Preset)
        run: |
          python -m backlog_assistant.cli evaluate --offline
          python -m backlog_assistant.cli evaluate --config config/presets/incident_triage_scenario.json --offline
